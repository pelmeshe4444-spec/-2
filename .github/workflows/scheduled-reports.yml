name: Attendance scheduled reports

on:
  schedule:
    - cron: '5,35 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: attendance-scheduled-reports

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run due reports on Render
        env:
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          if [ -z "$SCHEDULER_SECRET" ]; then
            echo 'Set the repository secret SCHEDULER_SECRET to enable report delivery.' >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors --max-time 100 \
            -X POST -H "Authorization: Bearer ${SCHEDULER_SECRET}" \
            https://2-cmnw.onrender.com/api/internal/scheduler/run | grep -F '{"ok":true}'
