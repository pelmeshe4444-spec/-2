name: Attendance Docker check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: registration
          POSTGRES_USER: attendance
          POSTGRES_PASSWORD: attendance-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attendance -d registration"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python -m pip check
      - name: Test the bot and API
        run: .venv/bin/python -m pytest -q
      - name: Test Telegram registration and recipient assignment on PostgreSQL
        env:
          ATTENDANCE_REGISTRATION_TEST_DATABASE_URL: postgresql+asyncpg://attendance:attendance-ci@127.0.0.1:5432/registration
        run: .venv/bin/python -m pytest tests/test_registration_recipients.py -q
      - name: Build and test the Mini App
        working-directory: frontend
        run: |
          npm ci
          npm run test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Build GitHub Pages frontend
        working-directory: frontend
        env:
          VITE_BASE_PATH: /-2/
          VITE_API_URL: https://2-cmnw.onrender.com
        run: npm run build
      - name: Package GitHub Pages frontend
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: attendance
          POSTGRES_USER: attendance
          POSTGRES_PASSWORD: attendance-ci
        options: >-
          --health-cmd "pg_isready -U attendance -d attendance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Build the Render Docker image
        run: docker build -t attendance:ci .
      - name: Seed a student and an attendance mark before the upgrade
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker run --rm --network "${{ job.services.postgres.network }}" \
            --env DATABASE_URL=postgresql://attendance:attendance-ci@postgres/attendance \
            attendance:ci python -m alembic upgrade 0004
          docker exec -i "$POSTGRES_CONTAINER" psql -U attendance -d attendance -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO classes (id, name, name_key, is_active) VALUES (801, 'QA Archive', 'qa archive', false);
          INSERT INTO users (id, telegram_id, created_at) VALUES (802, 6000, '2026-01-05');
          INSERT INTO students (id, last_name, first_name, class_id, is_active, created_at, updated_at)
          VALUES (803, 'Иванов', 'Иван', 801, false, '2026-01-05', '2026-01-05');
          INSERT INTO enrollments (student_id, class_id, starts_on) VALUES (803, 801, '2026-01-05');
          INSERT INTO attendance (student_id, date, status, marked_by, updated_at)
          VALUES (803, '2026-01-05', 2, 802, '2026-01-05');
          SQL
      - name: Verify the container binds to PORT and serves the API and frontend
        run: |
          docker run --detach --name attendance-ci --publish 127.0.0.1:14183:14183 \
            --network "${{ job.services.postgres.network }}" \
            --env PORT=14183 --env OWNER_ID=101 --env BOT_TOKEN=123456:ci-smoke-placeholder \
            --env DATABASE_URL=postgresql://attendance:attendance-ci@postgres/attendance \
            attendance:ci
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-all-errors \
            --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:14183/api/health | grep -F '{"status":"ok"}'
          curl --fail --silent --show-error http://127.0.0.1:14183/ | grep -F '<title>Attendance</title>'
      - name: Verify administrative writes persist across a backend restart
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U attendance -d attendance -Atc \
            'SELECT s.full_name, a.status, e.class_id FROM students s JOIN attendance a ON a.student_id = s.id JOIN enrollments e ON e.student_id = s.id WHERE s.id = 803' \
            | grep -Fx 'Иванов Иван|2|801'
          python3 tests/docker_admin_smoke.py
          docker restart attendance-ci
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-all-errors \
            --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:14183/api/health | grep -F '{"status":"ok"}'
          python3 tests/docker_admin_smoke.py --verify-only
      - name: Container logs on failure
        if: failure()
        run: docker logs attendance-ci || true

  publish-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [application-tests, build-and-smoke-test]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
