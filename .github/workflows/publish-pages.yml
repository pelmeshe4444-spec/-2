name: Publish verified Attendance frontend

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pages: write
      id-token: write
    concurrency:
      group: attendance-github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Require a verified main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          count=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '[.check_runs[] | select(.name == "validate" and .conclusion == "success")] | length')
          test "$count" -gt 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend for Supabase
        working-directory: frontend
        env:
          VITE_BASE_PATH: /-2/
          VITE_API_URL: https://vuwucpvbaaaguksdbznr.supabase.co/functions/v1/api
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - uses: actions/deploy-pages@v4
        id: deployment
