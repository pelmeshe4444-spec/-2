name: Attendance Supabase

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: attendance_test
          POSTGRES_USER: attendance
          POSTGRES_PASSWORD: attendance-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attendance -d attendance_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ATTENDANCE_TEST_DATABASE_URL: postgresql://attendance:attendance-ci@127.0.0.1:5432/attendance_test
      ATTENDANCE_TEST_EDGE: '1'
      ATTENDANCE_TEST_DENO: deno
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check Edge Functions
        run: deno task --config supabase/functions/deno.json check
      - name: Test authentication, migrations and application contracts on PostgreSQL
        run: deno task --config supabase/functions/deno.json test
      - name: Build and test the Mini App
        working-directory: frontend
        run: |
          npm ci
          npm run test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Build GitHub Pages frontend
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: frontend
        env:
          VITE_BASE_PATH: /-2/
          VITE_API_URL: https://vuwucpvbaaaguksdbznr.supabase.co/functions/v1/api
        run: npm run build
      - name: Package GitHub Pages frontend
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy-edge:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Deploy authenticated Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$PROJECT_REF"
          supabase functions deploy api telegram-webhook send-report report-scheduler \
            --remote="$PROJECT_REF" --import-map supabase/functions/deno.json --use-api --yes

  publish-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ATTENDANCE_SUPABASE_ENABLED == 'true'
    needs: [validate, deploy-edge]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: attendance-github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
